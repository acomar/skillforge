name: Shortform manga smoke

on:
  push:
    paths:
      - "skills/video-editing-shortform-manga/**"
      - "tests/test_shortform_render.py"
      - ".github/workflows/shortform-smoke.yml"
  pull_request:
    paths:
      - "skills/video-editing-shortform-manga/**"
      - "tests/test_shortform_render.py"
      - ".github/workflows/shortform-smoke.yml"

permissions:
  contents: read

jobs:
  render-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Check FFmpeg
        run: ffmpeg -version && ffprobe -version
      - name: Compile renderer
        run: python -m py_compile skills/video-editing-shortform-manga/scripts/shortform_render.py
      - name: Run shortform smoke tests
        run: python -m unittest discover -s tests -p test_shortform_render.py -v
